[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdxhub-sdk"
version = "0.2.0"
description = "通达信本地数据、行情与财务数据读取工具"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "randon"}]
keywords = ["tongdaxin", "tdx", "finance", "market-data", "pandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "prettytable>=3.10,<4",
    "tdxpy>=0.2.7,<1",
    "tenacity>=8.2,<10",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# Kept for compatibility: CLI dependencies are now installed with the core package.
cli = []
holiday = ["mini-racer>=0.12,<1"]
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
all = [
    "mini-racer>=0.12,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
test = ["pytest>=8.3,<9"]

[project.scripts]
tdxhub = "tdxhub.__main__:entry"

[project.urls]
Homepage = "https://github.com/RandomLiu2025/tdx-hub"
Documentation = "https://github.com/RandomLiu2025/tdx-hub/tree/main/docs/"
Repository = "https://github.com/RandomLiu2025/tdx-hub"
Issues = "https://github.com/RandomLiu2025/tdx-hub/issues"

[tool.setuptools.packages.find]
include = ["tdxhub*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"tdxhub.utils" = ["holiday.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network and not integration'"
markers = [
    "network: requires live public network services",
    "integration: exercises an external local data installation",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["tdxhub/utils/demjson.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["tdxhub"]

[tool.coverage.report]
show_missing = true
skip_covered = true
