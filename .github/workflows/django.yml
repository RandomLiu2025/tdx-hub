# Historical filename retained; the former duplicate test workflow is now reusable.
name: Independent wheel smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv run --no-project python scripts/check_package.py dist/*.whl dist/*.tar.gz
      - name: Install wheel in a separate environment and test outside checkout
        run: uv run --no-project python scripts/check_wheel_install.py dist/*.whl
